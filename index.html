<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ticket Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}

h1 {
  margin-bottom: 20px;
}

input {
  font-size: 20px;
  padding: 12px;
  width: 200px;
  text-align: center;
  border-radius: 8px;
  border: 1px solid #aaa;
}

button {
  font-size: 20px;
  padding: 12px 20px;
  margin: 15px 5px;
  border: 0;
  border-radius: 8px;
  background: #222;
  color: white;
}

button:active {
  transform: scale(0.98);
}

#video {
  width: 100%;
  max-width: 500px;
  margin-top: 15px;
  border-radius: 12px;
  background: black;
}

#result {
  margin-top: 20px;
  padding: 20px;
  border-radius: 12px;
  font-size: 22px;
  font-weight: bold;
}

canvas {
  display: none;
}

</style>

</head>


<body>

<h1>🎟️ Ticket Scanner</h1>


<input
  id="pin"
  type="password"
  placeholder="Scanner PIN"
  inputmode="numeric"
  autocomplete="off"
>

<br>


<button
  id="startButton"
  type="button"
  onclick="startScanner()"
>
  📷 Scanner starten
</button>


<video
  id="video"
  playsinline
  autoplay
></video>


<canvas id="canvas"></canvas>


<div id="result"></div>


<script>

/************************************************
 * JOUW NIEUWE GOOGLE APPS SCRIPT URL
 ************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzDpQQLQ2VWroJLGCbIJfhBjcxjIQG3mxD3vxdluHUvYI-gjLn28OaQQQEm2JN1aWcS/exec";


/************************************************
 * ELEMENTEN
 ************************************************/

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const result =
  document.getElementById("result");


let scanning = false;

let stream = null;


/************************************************
 * SCANNER STARTEN
 ************************************************/

async function startScanner() {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if (!pin) {

    alert(
      "Vul eerst de Scanner PIN in."
    );

    return;
  }


  result.style.background = "";

  result.innerHTML =
    "📷 Camera wordt gestart...";


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          }

        },

        audio: false

      });


    video.srcObject = stream;

    await video.play();


    scanning = true;


    result.innerHTML =
      "🟢 Richt de camera op de QR-code.";


    scanQR(pin);


  } catch (error) {

    scanning = false;


    result.style.background =
      "#ffcaca";


    result.innerHTML =

      "❌ Camera kan niet worden gestart." +
      "<br><br>" +

      "<small>" +

      error.name +
      ": " +
      error.message +

      "</small>";

  }

}


/************************************************
 * QR-CODE SCANNEN
 ************************************************/

function scanQR(pin) {

  if (!scanning) {
    return;
  }


  if (
    video.readyState >=
    video.HAVE_ENOUGH_DATA
  ) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height
      );


    if (code) {

      scanning = false;


      controleerTicket(
        code.data,
        pin
      );


      return;

    }

  }


  requestAnimationFrame(
    function() {
      scanQR(pin);
    }
  );

}


/************************************************
 * TICKET CONTROLEREN
 ************************************************/

function controleerTicket(
  token,
  pin
) {

  result.style.background = "";

  result.innerHTML =
    "⏳ Ticket controleren...";


  /*
   * Unieke callbacknaam
   */

  const callbackNaam =
    "ticketCallback_" +
    Date.now();


  /*
   * Antwoord van Apps Script
   */

  window[callbackNaam] =
    function(antwoord) {


      /*
       * GELDIG
       */

      if (antwoord.success === true) {

        result.style.background =
          "#c8f7d0";


        result.innerHTML =

          "✅ GELDIG TICKET" +
          "<br><br>" +

          "<b>" +
          escapeHtml(
            antwoord.naam || ""
          ) +
          "</b>" +

          "<br><br>" +

          "Aantal tickets: " +

          escapeHtml(
            String(
              antwoord.aantal || ""
            )
          );

      }


      /*
       * ONGELDIG
       */

      else {

        result.style.background =
          "#ffcaca";


        result.innerHTML =

          "❌ ONGELDIG TICKET" +
          "<br><br>" +

          escapeHtml(
            antwoord.message ||
            antwoord.melding ||
            "Ticket ongeldig."
          );

      }


      /*
       * Na 3 seconden opnieuw klaar
       */

      setTimeout(
        function() {

          result.style.background =
            "";

          result.innerHTML =
            "🟢 Klaar voor volgende ticket.";


          scanning = true;


          scanQR(pin);

        },
        3000
      );

    };


  /*
   * Als er een fout optreedt
   */

  window.onerror =
    function() {

      result.style.background =
        "#ffcaca";

      result.innerHTML =
        "❌ Er ging iets mis bij het controleren.";

    };


  /*
   * JSONP-script maken
   */

  const script =
    document.createElement(
      "script"
    );


  script.src =

    APPS_SCRIPT_URL +

    "?actie=scan" +

    "&token=" +

    encodeURIComponent(token) +

    "&pin=" +

    encodeURIComponent(pin) +

    "&callback=" +

    encodeURIComponent(
      callbackNaam
    );


  /*
   * Script toevoegen
   */

  document.body.appendChild(
    script
  );


  /*
   * Opruimen na antwoord
   */

  setTimeout(
    function() {

      try {

        delete window[
          callbackNaam
        ];

      } catch (e) {}

    },
    10000
  );

}


/************************************************
 * HTML VEILIG WEERGEVEN
 ************************************************/

function escapeHtml(text) {

  return String(text || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
