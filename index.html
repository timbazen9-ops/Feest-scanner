
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feest-scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container { max-width: 560px; margin: auto; }
    h1 { font-size: 30px; margin: 10px 0 20px; }
    #pinBox {
      padding: 24px;
      background: #222;
      border-radius: 16px;
    }
    input {
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid #aaa;
      font-size: 22px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 16px;
      background: white;
      color: black;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    #scannerBox { display: none; }
    #reader {
      width: 100%;
      background: white;
      border-radius: 16px;
      overflow: hidden;
    }
    #status {
      margin-top: 18px;
      padding: 24px 14px;
      min-height: 140px;
      background: #222;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #statusTitel { font-size: 29px; font-weight: bold; }
    #statusNaam {
      font-size: 24px;
      margin-top: 12px;
      font-weight: bold;
    }
    #statusExtra { font-size: 16px; margin-top: 10px; }
    .goed { background: #08752b !important; }
    .fout { background: #b3261e !important; }
    .bezig { background: #244a7c !important; }
    .klein {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎟️ Feest-scanner</h1>

  <div id="pinBox">
    <p>Vul de organisator-PIN in.</p>
    <input
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Scanner PIN"
    >
    <button type="button" onclick="scannerStarten()">
      📷 Scanner starten
    </button>
  </div>

  <div id="scannerBox">
    <div id="reader"></div>
    <div id="status">
      <div id="statusTitel">Scanner starten...</div>
      <div id="statusNaam"></div>
      <div id="statusExtra"></div>
    </div>
    <div class="klein">
      Oude en nieuwe tickets worden automatisch
      met hun eigen ticketserver gecontroleerd.
    </div>
  </div>
</div>

<script>
"use strict";

/* OUDE TICKETSERVER */
const OUDE_SERVER =
  "https://script.google.com/macros/s/" +
  "AKfycbxJZJgxn0BpdSv8b2K9MAuNaPvgsBlCO5tdnlivnWTFdNqnB8w6frFH0dofm4Oyx9YF/exec";

/* NIEUWE TICKETSERVER */
const NIEUWE_SERVER =
  "https://script.google.com/macros/s/" +
  "AKfycbwFLr6G7jniy76Oh8XEnkgE-t-eLymvFBXxPmzCTa-NLtanWgVY5D2_jVdrOk3SS2Ff/exec";

let scanner = null;
let scannerPin = "";
let bezig = false;
let laatsteQr = "";
let laatsteScanTijd = 0;
let resetTimer = null;

function toonStatus(titel, naam, extra, soort) {
  const box = document.getElementById("status");
  box.className = soort || "";

  document.getElementById("statusTitel").textContent =
    titel || "";
  document.getElementById("statusNaam").textContent =
    naam || "";
  document.getElementById("statusExtra").textContent =
    extra || "";
}

/*
  Lees het ticket uit de QR-code.
  De server wordt gekozen op basis van het adres
  dat daadwerkelijk in de QR-code staat.
*/
function haalTicketUitQr(qrTekst) {
  try {
    const url = new URL(qrTekst.trim());

    if (
      url.protocol !== "https:" ||
      url.hostname !== "script.google.com"
    ) {
      return null;
    }

    const pad = url.pathname.replace(/\/$/, "");
    let server = null;

    if (pad === new URL(OUDE_SERVER).pathname) {
      server = OUDE_SERVER;
    } else if (
      pad === new URL(NIEUWE_SERVER).pathname
    ) {
      server = NIEUWE_SERVER;
    } else {
      return null;
    }

    const id = url.searchParams.get("id");
    const token = url.searchParams.get("token");

    if (!id || !token) {
      return null;
    }

    return {
      id: id.trim(),
      token: token.trim(),
      server: server
    };
  } catch (error) {
    return null;
  }
}

/*
  De server geeft JSONP terug:
  callbackNaam({...});
*/
function roepScannerApiAan(ticket) {
  return new Promise(function(resolve, reject) {
    const callbackNaam =
      "__feestScanner_" +
      Date.now() + "_" +
      Math.floor(Math.random() * 1000000);

    const script = document.createElement("script");
    let afgehandeld = false;

    const timeout = setTimeout(function() {
      afronden();
      reject(
        new Error("De ticketserver reageert niet.")
      );
    }, 15000);

    function afronden() {
      if (afgehandeld) return;
      afgehandeld = true;
      clearTimeout(timeout);
      script.onerror = null;

      try {
        delete window[callbackNaam];
      } catch (error) {
        window[callbackNaam] = undefined;
      }

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    window[callbackNaam] = function(data) {
      if (afgehandeld) return;
      afronden();
      resolve(data);
    };

    script.onerror = function() {
      if (afgehandeld) return;
      afronden();
      reject(
        new Error(
          "Ticketserver kon niet worden bereikt."
        )
      );
    };

    const parameters = new URLSearchParams({
      page: "scanapi",
      id: ticket.id,
      token: ticket.token,
      pin: scannerPin,
      callback: callbackNaam,
      t: String(Date.now())
    });

    script.src =
      ticket.server + "?" + parameters.toString();

    document.body.appendChild(script);
  });
}

function laterWeerKlaar(milliseconds) {
  if (resetTimer !== null) {
    clearTimeout(resetTimer);
  }

  resetTimer = setTimeout(function() {
    resetTimer = null;
    scannerWeerKlaar();
  }, milliseconds);
}

async function qrGevonden(qrTekst) {
  const nu = Date.now();

  if (bezig) return;

  if (
    qrTekst === laatsteQr &&
    nu - laatsteScanTijd < 4000
  ) {
    return;
  }

  bezig = true;
  laatsteQr = qrTekst;
  laatsteScanTijd = nu;

  const ticket = haalTicketUitQr(qrTekst);

  if (!ticket) {
    toonStatus(
      "✕ ONGELDIGE QR-CODE",
      "",
      "Dit is geen herkend oud of nieuw ticket.",
      "fout"
    );
    laterWeerKlaar(2500);
    return;
  }

  toonStatus(
    "Ticket controleren...",
    "",
    "Even geduld.",
    "bezig"
  );

  try {
    const resultaat = await roepScannerApiAan(ticket);

    console.log(
      "Ticketserver:",
      ticket.server,
      "Resultaat:",
      resultaat
    );

    if (resultaat && resultaat.geldig === true) {
      toonStatus(
        "✓ TICKET GELDIG",
        resultaat.naam || "",
        "Toegang toegestaan.",
        "goed"
      );
      laterWeerKlaar(2200);
      return;
    }

    if (resultaat && resultaat.fout === "pin") {
      toonStatus(
        "✕ ONJUISTE PIN",
        "",
        "Ververs de pagina en voer de juiste PIN in.",
        "fout"
      );
      // Niet automatisch verder scannen met een
      // onjuiste PIN.
      return;
    }

    if (
      resultaat &&
      (
        resultaat.gebruikt === true ||
        resultaat.fout === "gebruikt"
      )
    ) {
      toonStatus(
        "✕ TICKET AL GEBRUIKT",
        resultaat.naam || "",
        resultaat.gebruiktOp
          ? "Gebruikt op: " + resultaat.gebruiktOp
          : "Dit ticket is al eerder gescand.",
        "fout"
      );
      laterWeerKlaar(2500);
      return;
    }

    if (
      resultaat &&
      resultaat.fout === "niet_betaald"
    ) {
      toonStatus(
        "✕ TICKET NIET BETAALD",
        resultaat.naam || "",
        "De betaling is nog niet bevestigd.",
        "fout"
      );
      laterWeerKlaar(2500);
      return;
    }

    toonStatus(
      "✕ ONGELDIG TICKET",
      resultaat && resultaat.naam
        ? resultaat.naam
        : "",
      resultaat && resultaat.bericht
        ? resultaat.bericht
        : "Ticket niet gevonden of gegevens kloppen niet.",
      "fout"
    );
    laterWeerKlaar(2500);

  } catch (error) {
    console.error("Scannerfout:", error);

    toonStatus(
      "✕ VERBINDINGSFOUT",
      "",
      error.message ||
        "Ticketserver kon niet worden bereikt.",
      "fout"
    );
    laterWeerKlaar(3000);
  }
}

function scannerWeerKlaar() {
  bezig = false;
  toonStatus(
    "Klaar voor volgende ticket",
    "",
    "Scan de volgende QR-code.",
    ""
  );
}

function scannerStarten() {
  const pin = document.getElementById("pin")
    .value.trim();

  if (!pin) {
    alert("Vul eerst de scanner-PIN in.");
    return;
  }

  if (scanner !== null) {
    return;
  }

  scannerPin = pin;

  document.getElementById("pinBox")
    .style.display = "none";

  document.getElementById("scannerBox")
    .style.display = "block";

  toonStatus(
    "Camera starten...",
    "",
    "Geef cameratoegang als daarom wordt gevraagd.",
    "bezig"
  );

  scanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      },
      rememberLastUsedCamera: true,
      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]
    },
    false
  );

  scanner.render(
    function(decodedText) {
      qrGevonden(decodedText);
    },
    function(errorMessage) {
      // Normale zoekmeldingen niet tonen.
    }
  );

  toonStatus(
    "Camera klaar",
    "",
    "Richt de camera op een ticket.",
    ""
  );
}

document.getElementById("pin")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      scannerStarten();
    }
  });
</script>

</body>
</html>
