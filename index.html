<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Feest-scanner</title>

  <!-- QR-scanner bibliotheek -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 8px;
      margin-bottom: 18px;
      font-size: 30px;
    }

    #pinBox {
      background: #222;
      padding: 22px;
      border-radius: 16px;
      margin-top: 20px;
    }

    #pinBox p {
      margin-top: 0;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;

      border: 1px solid #aaa;
      border-radius: 10px;

      font-size: 20px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 16px;

      border: none;
      border-radius: 10px;

      background: white;
      color: black;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    #scannerBox {
      display: none;
    }

    #reader {
      width: 100%;
      overflow: hidden;

      background: white;
      border-radius: 16px;
    }

    #status {
      margin-top: 18px;

      min-height: 120px;
      padding: 20px;

      border-radius: 16px;

      background: #222;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      transition: background 0.2s;
    }

    #statusTitel {
      font-size: 28px;
      font-weight: bold;
    }

    #statusNaam {
      margin-top: 10px;
      font-size: 23px;
      font-weight: bold;
    }

    #statusExtra {
      margin-top: 8px;
      font-size: 16px;
    }

    .goed {
      background: #08752b !important;
    }

    .fout {
      background: #b3261e !important;
    }

    .waarschuwing {
      background: #9a6700 !important;
    }

    .bezig {
      background: #244a7c !important;
    }

    .klein {
      margin-top: 14px;
      font-size: 14px;
      opacity: 0.75;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎟️ Feest-scanner</h1>


  <!-- ============================= -->
  <!-- PIN SCHERM -->
  <!-- ============================= -->

  <div id="pinBox">

    <p>
      Vul de organisator-PIN in om de scanner te starten.
    </p>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Scanner PIN"
    >

    <button
      type="button"
      onclick="scannerStarten()"
    >
      📷 Scanner starten
    </button>

  </div>


  <!-- ============================= -->
  <!-- SCANNER -->
  <!-- ============================= -->

  <div id="scannerBox">

    <div id="reader"></div>

    <div id="status">

      <div id="statusTitel">
        Scanner starten...
      </div>

      <div id="statusNaam"></div>

      <div id="statusExtra"></div>

    </div>

    <div class="klein">
      Na iedere controle is de scanner automatisch
      weer klaar voor het volgende ticket.
    </div>

  </div>

</div>


<script>

/* =========================================================
   INSTELLINGEN
========================================================= */

const WEBAPP_URL =
  "https://script.google.com/macros/s/AKfycbxJZJgxn0BpdSv8b2K9MAuNaPvgsBlCO5tdnlivnWTFdNqnB8w6frFH0dofm4Oyx9YF/exec";


/* =========================================================
   VARIABELEN
========================================================= */

let scanner = null;

let scannerPin = "";

let bezig = false;

let laatsteQr = "";

let laatsteScanTijd = 0;


/* =========================================================
   STATUS TONEN
========================================================= */

function toonStatus(
  titel,
  naam,
  extra,
  soort
) {

  const box =
    document.getElementById("status");

  const titelEl =
    document.getElementById("statusTitel");

  const naamEl =
    document.getElementById("statusNaam");

  const extraEl =
    document.getElementById("statusExtra");


  box.className = "";


  if (soort) {
    box.classList.add(soort);
  }


  titelEl.textContent =
    titel || "";

  naamEl.textContent =
    naam || "";

  extraEl.textContent =
    extra || "";
}


/* =========================================================
   QR-CODE UITLEZEN
========================================================= */

function haalTicketUitQr(qrTekst) {

  try {

    const url =
      new URL(qrTekst);


    const id =
      url.searchParams.get("id");


    const token =
      url.searchParams.get("token");


    if (!id || !token) {

      return null;

    }


    return {

      id: String(id).trim(),

      token: String(token).trim()

    };


  } catch (error) {

    return null;

  }

}


/* =========================================================
   APPS SCRIPT AANROEPEN
   JSONP WORDT GEBRUIKT OMDAT DE SCANNER
   OP GITHUB PAGES STAAT.
========================================================= */

function roepScannerApiAan(
  ticket,
  volledigeQr
) {

  return new Promise(
    function(resolve, reject) {


      const callbackNaam =

        "__ticketScannerCallback_" +

        Date.now() +

        "_" +

        Math.floor(
          Math.random() * 1000000
        );


      const script =
        document.createElement("script");


      let afgehandeld = false;


      /* ---------------------------------
         TIMEOUT
      --------------------------------- */

      const timeout =
        setTimeout(
          function() {

            opruimen();

            reject(
              new Error(
                "Ticketserver reageert niet."
              )
            );

          },
          15000
        );


      /* ---------------------------------
         OPRUIMEN
      --------------------------------- */

      function opruimen() {

        if (afgehandeld) {
          return;
        }

        afgehandeld = true;


        clearTimeout(timeout);


        try {

          delete window[callbackNaam];

        } catch (error) {

          window[callbackNaam] =
            undefined;

        }


        if (script.parentNode) {

          script.parentNode
            .removeChild(script);

        }

      }


      /* ---------------------------------
         CALLBACK VAN APPS SCRIPT
      --------------------------------- */

      window[callbackNaam] =
        function(data) {

          opruimen();

          resolve(data);

        };


      /* ---------------------------------
         SCRIPT FOUT
      --------------------------------- */

      script.onerror =
        function() {

          opruimen();

          reject(
            new Error(
              "Ticketserver kon niet worden bereikt."
            )
          );

        };


      /* ---------------------------------
         API URL
      --------------------------------- */

      const apiUrl =

        WEBAPP_URL +

        "?page=scanapi" +

        "&id=" +
        encodeURIComponent(ticket.id) +

        "&token=" +
        encodeURIComponent(ticket.token) +

        "&qr=" +
        encodeURIComponent(volledigeQr) +

        "&pin=" +
        encodeURIComponent(scannerPin) +

        "&callback=" +
        encodeURIComponent(callbackNaam) +

        "&tijd=" +
        Date.now();


      script.src =
        apiUrl;


      document.body
        .appendChild(script);

    }
  );

}


/* =========================================================
   QR GEVONDEN
========================================================= */

async function qrGevonden(
  qrTekst
) {

  const nu =
    Date.now();


  /* Scanner is al bezig */

  if (bezig) {

    return;

  }


  /* Voorkom dat dezelfde QR meteen
     tientallen keren wordt gelezen */

  if (
    qrTekst === laatsteQr &&
    nu - laatsteScanTijd < 4000
  ) {

    return;

  }


  laatsteQr =
    qrTekst;

  laatsteScanTijd =
    nu;

  bezig =
    true;


  /* ---------------------------------
     QR UITLEZEN
  --------------------------------- */

  const ticket =
    haalTicketUitQr(qrTekst);


  if (!ticket) {

    toonStatus(
      "✕ ONGELDIGE QR-CODE",
      "",
      "Dit is geen geldige ticket-QR.",
      "fout"
    );


    setTimeout(
      scannerWeerKlaar,
      2200
    );


    return;

  }


  /* ---------------------------------
     CONTROLEREN
  --------------------------------- */

  toonStatus(
    "Ticket controleren...",
    "",
    "Even geduld",
    "bezig"
  );


  try {


    const resultaat =

      await roepScannerApiAan(
        ticket,
        qrTekst
      );


    console.log(
      "Antwoord ticketserver:",
      resultaat
    );


    /* =================================
       GELDIG
    ================================= */

    if (
      resultaat &&
      resultaat.geldig === true
    ) {

      toonStatus(
        "✓ TICKET GELDIG",
        resultaat.naam || "",
        "Toegang toegestaan",
        "goed"
      );


      setTimeout(
        scannerWeerKlaar,
        2200
      );


      return;

    }


    /* =================================
       VERKEERDE PIN
    ================================= */

    if (
      resultaat &&
      resultaat.fout === "pin"
    ) {

      toonStatus(
        "✕ ONJUISTE PIN",
        "",
        "Ververs de pagina en voer de juiste PIN in.",
        "fout"
      );


      /* Niet automatisch doorgaan */

      return;

    }


    /* =================================
       AL GEBRUIKT
    ================================= */

    if (
      resultaat &&
      (
        resultaat.gebruikt === true ||
        resultaat.fout === "gebruikt"
      )
    ) {

      toonStatus(
        "✕ TICKET AL GEBRUIKT",
        resultaat.naam || "",
        resultaat.gebruiktOp
          ? "Gebruikt: " +
            resultaat.gebruiktOp
          : "",
        "fout"
      );


      setTimeout(
        scannerWeerKlaar,
        2500
      );


      return;

    }


    /* =================================
       NIET BETAALD
    ================================= */

    if (
      resultaat &&
      resultaat.fout === "niet_betaald"
    ) {

      toonStatus(
        "✕ TICKET NIET BETAALD",
        resultaat.naam || "",
        "Betaling is nog niet bevestigd.",
        "fout"
      );


      setTimeout(
        scannerWeerKlaar,
        2500
      );


      return;

    }


    /* =================================
       ONGELDIG
    ================================= */

    toonStatus(
      "✕ ONGELDIG TICKET",
      resultaat &&
      resultaat.naam
        ? resultaat.naam
        : "",
      resultaat &&
      resultaat.bericht
        ? resultaat.bericht
        : "Ticket bestaat niet of gegevens kloppen niet.",
      "fout"
    );


    setTimeout(
      scannerWeerKlaar,
      2500
    );


  } catch (error) {


    console.error(
      "Scannerfout:",
      error
    );


    toonStatus(
      "✕ VERBINDINGSFOUT",
      "",
      error.message ||
      "Ticketserver kon niet worden bereikt.",
      "fout"
    );


    setTimeout(
      scannerWeerKlaar,
      3000
    );

  }

}


/* =========================================================
   SCANNER WEER VRIJGEVEN
========================================================= */

function scannerWeerKlaar() {

  bezig =
    false;


  toonStatus(
    "Klaar voor volgende ticket",
    "",
    "Scan de volgende QR-code.",
    ""
  );

}


/* =========================================================
   SCANNER STARTEN
========================================================= */

function scannerStarten() {


  const pin =

    document
      .getElementById("pin")
      .value
      .trim();


  if (!pin) {

    alert(
      "Vul eerst de organisator-PIN in."
    );

    return;

  }


  scannerPin =
    pin;


  /* PIN scherm verbergen */

  document
    .getElementById("pinBox")
    .style.display =
      "none";


  /* Scanner zichtbaar maken */

  document
    .getElementById("scannerBox")
    .style.display =
      "block";


  toonStatus(
    "Camera starten...",
    "",
    "Geef cameratoegang als daarom wordt gevraagd.",
    "bezig"
  );


  /* ---------------------------------
     HTML5 QR SCANNER
  --------------------------------- */

  scanner =
    new Html5QrcodeScanner(

      "reader",

      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        },

        rememberLastUsedCamera:
          true,

        supportedScanTypes: [

          Html5QrcodeScanType
            .SCAN_TYPE_CAMERA

        ]

      },

      false

    );


  /* ---------------------------------
     START
  --------------------------------- */

  scanner.render(

    function(decodedText) {

      qrGevonden(
        decodedText
      );

    },

    function(errorMessage) {

      /*
        Dit is normaal tijdens het zoeken
        naar een QR-code.

        Daarom tonen we deze meldingen
        niet op het scherm.
      */

    }

  );


  toonStatus(
    "Camera klaar",
    "",
    "Richt de camera op een ticket.",
    ""
  );

}


/* =========================================================
   ENTER BIJ PIN
========================================================= */

document
  .getElementById("pin")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        scannerStarten();

      }

    }
  );

</script>

</body>
</html>
