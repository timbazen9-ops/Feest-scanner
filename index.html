<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Feest-scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 560px;
      margin: auto;
    }

    h1 {
      font-size: 30px;
      margin: 10px 0 20px;
    }

    #pinBox {
      padding: 24px;
      background: #222;
      border-radius: 16px;
    }

    input {
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid #aaa;
      font-size: 22px;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 16px;
      background: white;
      color: black;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #scannerBox {
      display: none;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 16px;
      overflow: hidden;
    }

    #status {
      margin-top: 18px;
      padding: 24px 14px;
      min-height: 140px;
      background: #222;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #statusTitel {
      font-size: 29px;
      font-weight: bold;
    }

    #statusNaam {
      font-size: 24px;
      margin-top: 12px;
      font-weight: bold;
    }

    #statusExtra {
      font-size: 16px;
      margin-top: 10px;
    }

    .goed {
      background: #08752b !important;
    }

    .fout {
      background: #b3261e !important;
    }

    .bezig {
      background: #244a7c !important;
    }

    .klein {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 16px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎟️ Feest-scanner</h1>

  <div id="pinBox">

    <p>Vul de organisator-PIN in.</p>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Scanner PIN"
    >

    <button onclick="scannerStarten()">
      📷 Scanner starten
    </button>

  </div>

  <div id="scannerBox">

    <div id="reader"></div>

    <div id="status">
      <div id="statusTitel">
        Scanner starten...
      </div>

      <div id="statusNaam"></div>

      <div id="statusExtra"></div>
    </div>

    <div class="klein">
      Oude en nieuwe tickets worden geaccepteerd.
      Na iedere controle kun je direct verder scannen.
    </div>

  </div>

</div>

<script>

/* =========================================
   NIEUWE TICKETSERVER
========================================= */

const WEBAPP_URL =
  "https://script.google.com/macros/s/AKfycbwFLr6G7jniy76Oh8XEnkgE-t-eLymvFBXxPmzCTa-NLtanWgVY5D2_jVdrOk3SS2Ff/exec";


/* =========================================
   OUDE EN NIEUWE WEBAPP-ADRESSEN
========================================= */

const TOEGESTANE_WEBAPPS = [

  "AKfycbxJZJgxn0BpdSv8b2K9MAuNaPvgsBlCO5tdnlivnWTFdNqnB8w6frFH0dofm4Oyx9YF",

  "AKfycbwFLr6G7jniy76Oh8XEnkgE-t-eLymvFBXxPmzCTa-NLtanWgVY5D2_jVdrOk3SS2Ff"

];


/* =========================================
   VARIABELEN
========================================= */

let scanner = null;

let scannerPin = "";

let bezig = false;

let laatsteQr = "";

let laatsteScanTijd = 0;


/* =========================================
   STATUS TONEN
========================================= */

function toonStatus(titel, naam, extra, soort) {

  const box =
    document.getElementById("status");

  box.className = "";

  if (soort) {
    box.classList.add(soort);
  }

  document.getElementById("statusTitel")
    .textContent = titel || "";

  document.getElementById("statusNaam")
    .textContent = naam || "";

  document.getElementById("statusExtra")
    .textContent = extra || "";

}


/* =========================================
   OUDE EN NIEUWE QR-CODES HERKENNEN
========================================= */

function haalTicketUitQr(qrTekst) {

  try {

    const url = new URL(qrTekst);

    if (
      url.protocol !== "https:" ||
      url.hostname !== "script.google.com"
    ) {
      return null;
    }

    const match = url.pathname.match(
      /^\/macros\/s\/([^/]+)\/exec\/?$/
    );

    if (!match) {
      return null;
    }

    const webappId = match[1];

    if (!TOEGESTANE_WEBAPPS.includes(webappId)) {
      return null;
    }

    const id =
      url.searchParams.get("id");

    const token =
      url.searchParams.get("token");

    if (!id || !token) {
      return null;
    }

    return {
      id: id.trim(),
      token: token.trim()
    };

  } catch (error) {

    return null;

  }

}


/* =========================================
   VERBINDING MET TICKETSERVER
========================================= */

function roepScannerApiAan(ticket) {

  return new Promise(function(resolve, reject) {

    const callbackNaam =
      "__ticketCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 1000000);

    const script =
      document.createElement("script");

    let klaar = false;

    const timeout = setTimeout(function() {

      opruimen();

      reject(
        new Error(
          "Geen antwoord van de ticketserver."
        )
      );

    }, 15000);


    function opruimen() {

      if (klaar) {
        return;
      }

      klaar = true;

      clearTimeout(timeout);

      try {
        delete window[callbackNaam];
      } catch (error) {
        window[callbackNaam] = undefined;
      }

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    }


    window[callbackNaam] = function(data) {

      opruimen();

      resolve(data);

    };


    script.onerror = function() {

      opruimen();

      reject(
        new Error(
          "Ticketserver kon niet worden bereikt."
        )
      );

    };


    const apiUrl =
      WEBAPP_URL +
      "?page=scanapi" +
      "&id=" + encodeURIComponent(ticket.id) +
      "&token=" + encodeURIComponent(ticket.token) +
      "&pin=" + encodeURIComponent(scannerPin) +
      "&callback=" + encodeURIComponent(callbackNaam) +
      "&t=" + Date.now();


    script.src = apiUrl;

    document.body.appendChild(script);

  });

}


/* =========================================
   RESULTAAT VERWERKEN
========================================= */

async function qrGevonden(qrTekst) {

  const nu = Date.now();

  if (bezig) {
    return;
  }

  if (
    qrTekst === laatsteQr &&
    nu - laatsteScanTijd < 4000
  ) {
    return;
  }

  laatsteQr = qrTekst;

  laatsteScanTijd = nu;

  bezig = true;


  const ticket =
    haalTicketUitQr(qrTekst);


  if (!ticket) {

    toonStatus(
      "✕ ONGELDIGE QR-CODE",
      "",
      "Geen herkend oud of nieuw ticket.",
      "fout"
    );

    setTimeout(scannerWeerKlaar, 2200);

    return;

  }


  toonStatus(
    "Ticket controleren...",
    "",
    "Even geduld",
    "bezig"
  );


  try {

    const resultaat =
      await roepScannerApiAan(ticket);


    if (resultaat && resultaat.geldig === true) {

      toonStatus(
        "✓ TICKET GELDIG",
        resultaat.naam || "",
        "Toegang toegestaan",
        "goed"
      );

      setTimeout(scannerWeerKlaar, 2200);

      return;

    }


    if (resultaat && resultaat.fout === "pin") {

      toonStatus(
        "✕ ONJUISTE PIN",
        "",
        "Ververs de pagina en vul de juiste PIN in.",
        "fout"
      );

      return;

    }


    if (
      resultaat &&
      (
        resultaat.fout === "gebruikt" ||
        resultaat.gebruikt === true
      )
    ) {

      toonStatus(
        "✕ TICKET AL GEBRUIKT",
        resultaat.naam || "",
        resultaat.gebruiktOp
          ? "Gebruikt op: " + resultaat.gebruiktOp
          : "Dit ticket is al gescand.",
        "fout"
      );

      setTimeout(scannerWeerKlaar, 2500);

      return;

    }


    if (
      resultaat &&
      resultaat.fout === "niet_betaald"
    ) {

      toonStatus(
        "✕ NIET BETAALD",
        resultaat.naam || "",
        "Betaling is nog niet bevestigd.",
        "fout"
      );

      setTimeout(scannerWeerKlaar, 2500);

      return;

    }


    toonStatus(
      "✕ ONGELDIG TICKET",
      resultaat && resultaat.naam
        ? resultaat.naam
        : "",
      resultaat && resultaat.bericht
        ? resultaat.bericht
        : "Ticket niet gevonden.",
      "fout"
    );

    setTimeout(scannerWeerKlaar, 2500);


  } catch (error) {

    console.error(error);

    toonStatus(
      "✕ VERBINDINGSFOUT",
      "",
      error.message,
      "fout"
    );

    setTimeout(scannerWeerKlaar, 3000);

  }

}


/* =========================================
   SCANNER OPNIEUW KLAARZETTEN
========================================= */

function scannerWeerKlaar() {

  bezig = false;

  toonStatus(
    "Klaar voor volgende ticket",
    "",
    "Scan de volgende QR-code.",
    ""
  );

}


/* =========================================
   SCANNER STARTEN
========================================= */

function scannerStarten() {

  const pin =
    document.getElementById("pin")
      .value.trim();

  if (!pin) {

    alert("Vul eerst de scanner-PIN in.");

    return;

  }

  scannerPin = pin;

  document.getElementById("pinBox")
    .style.display = "none";

  document.getElementById("scannerBox")
    .style.display = "block";


  toonStatus(
    "Camera starten...",
    "",
    "Geef toestemming voor de camera.",
    "bezig"
  );


  scanner = new Html5QrcodeScanner(

    "reader",

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ]
    },

    false

  );


  scanner.render(

    function(decodedText) {

      qrGevonden(decodedText);

    },

    function(errorMessage) {

      // Tijdens het zoeken naar QR-codes
      // zijn deze meldingen normaal.

    }

  );


  toonStatus(
    "Camera klaar",
    "",
    "Richt de camera op een ticket.",
    ""
  );

}


/* =========================================
   ENTER OM PIN TE BEVESTIGEN
========================================= */

document.getElementById("pin")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      scannerStarten();
    }

  });

</script>

</body>
</html>
