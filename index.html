
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>14 nov fissa | Ticketscanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 22px;
      background: #202020;
      border-radius: 18px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    h2 {
      font-size: 18px;
      color: #ddd;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      background: #fff;
      color: #111;
      border: 1px solid #bbb;
    }

    button {
      background: #fff;
      color: #111;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reader {
      margin-top: 20px;
      background: white;
      color: black;
      border-radius: 12px;
      overflow: hidden;
    }

    #resultaat {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .info {
      background: #444;
      color: #fff;
    }

    .goed {
      background: #176b37;
      color: #fff;
    }

    .fout {
      background: #a51f1f;
      color: #fff;
    }

    .waarschuwing {
      background: #9b6900;
      color: #fff;
    }

    .scheiding {
      border: 0;
      border-top: 1px solid #555;
      margin: 25px 0;
    }

    .uitleg {
      font-size: 13px;
      color: #ccc;
      line-height: 1.5;
    }

    #debug {
      margin-top: 15px;
      font-size: 13px;
      color: #bbb;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🎟️ 14 nov fissa</h1>
    <h2>Ticketscanner</h2>

    <label for="pin">Scanner-PIN</label>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      placeholder="Vul scanner-PIN in"
      autocomplete="off"
    >

    <div id="reader"></div>

    <div id="resultaat" class="info">
      Vul de PIN in en richt de camera op een QR-code.
    </div>

    <hr class="scheiding">

    <h2>Handmatig controleren</h2>

    <input
      id="handmatig"
      type="text"
      placeholder="Plak hier de volledige ticketlink"
      autocomplete="off"
    >

    <button id="handmatigKnop" type="button">
      Controleer ticket
    </button>

    <button id="herstartKnop" type="button">
      Camera opnieuw starten
    </button>

    <p class="uitleg">
      Een geldig ticket wordt bij controle direct
      als gebruikt gemarkeerd en kan daarna niet
      nog een keer worden gebruikt.
    </p>

    <p id="debug"></p>

  </main>

  <script>
    "use strict";

    /*
      ======================================
      INSTELLINGEN
      ======================================
    */

    const SERVER =
      "https://script.google.com/macros/s/" +
      "AKfycbwFLr6G7jniy76Oh8XEnkgE-t-eLymvFBXxPmzCTa-NLtanWgVY5D2_jVdrOk3SS2Ff/exec";

    const REQUEST_TIMEOUT = 20000;

    /*
      ======================================
      ELEMENTEN
      ======================================
    */

    const pinInput =
      document.getElementById("pin");

    const handmatigInput =
      document.getElementById("handmatig");

    const resultaatVak =
      document.getElementById("resultaat");

    const debugVak =
      document.getElementById("debug");

    const handmatigKnop =
      document.getElementById("handmatigKnop");

    const herstartKnop =
      document.getElementById("herstartKnop");

    /*
      ======================================
      STATUS
      ======================================
    */

    let scanner = null;
    let bezig = false;

    let laatsteInvoer = "";
    let laatsteTijd = 0;

    /*
      ======================================
      SCHERM
      ======================================
    */

    function toon(tekst, soort) {
      resultaatVak.textContent = tekst;
      resultaatVak.className = soort || "info";
    }

    function debug(tekst) {
      debugVak.textContent = tekst || "";
    }

    function zetBezig(waarde) {
      bezig = waarde;
      handmatigKnop.disabled = waarde;
    }

    /*
      ======================================
      QR-CODE UITLEZEN
      ======================================

      De QR-code kan bevatten:

      1. Een ticketlink
      2. Een controlelink
      3. Een link met &amp;
      4. Een URL met extra tekst eromheen
      5. Alleen id=...&token=...

      Al deze vormen proberen we te lezen.
    */

    function leesTicket(invoer) {
      let tekst = String(invoer || "")
        .replace(/\uFEFF/g, "")
        .trim();

      if (!tekst) {
        throw new Error(
          "Er is geen QR-code gelezen."
        );
      }

      tekst = tekst
        .replace(/&amp;/gi, "&")
        .replace(/&#38;/g, "&")
        .replace(/[\r\n]+/g, "")
        .trim();

      let id = "";
      let token = "";

      /*
        Methode 1: volledige URL.
      */

      try {
        const url = new URL(tekst);

        id = url.searchParams.get("id") || "";
        token = url.searchParams.get("token") || "";

      } catch (err) {
        // Probeer de volgende methode.
      }

      /*
        Methode 2: URL ergens in de tekst.
      */

      if (!id || !token) {
        const urlMatch = tekst.match(
          /https?:\/\/[^\s"'<>]+/i
        );

        if (urlMatch) {
          try {
            const url = new URL(urlMatch[0]);

            id = id || url.searchParams.get("id") || "";
            token = token ||
              url.searchParams.get("token") || "";

          } catch (err) {
            // Probeer de volgende methode.
          }
        }
      }

      /*
        Methode 3: id en token rechtstreeks
        uit de QR-tekst halen.
      */

      if (!id || !token) {
        const idMatch = tekst.match(
          /(?:^|[?&#\s])id=([^&#\s]+)/i
        );

        const tokenMatch = tekst.match(
          /(?:^|[?&#\s])token=([^&#\s]+)/i
        );

        if (idMatch) {
          try {
            id = id ||
              decodeURIComponent(idMatch[1]);
          } catch (err) {
            id = id || idMatch[1];
          }
        }

        if (tokenMatch) {
          try {
            token = token ||
              decodeURIComponent(tokenMatch[1]);
          } catch (err) {
            token = token || tokenMatch[1];
          }
        }
      }

      /*
        Methode 4: querystring zonder URL.
      */

      if (!id || !token) {
        try {
          const params = new URLSearchParams(
            tekst.replace(/^[?#]/, "")
          );

          id = id || params.get("id") || "";
          token = token || params.get("token") || "";

        } catch (err) {
          // Geen geldige querystring.
        }
      }

      id = String(id).trim();
      token = String(token).trim();

      if (!id || !token) {
        throw new Error(
          "QR bevat geen herkenbare ticketlink " +
          "met id en token."
        );
      }

      return {
        id: id,
        token: token
      };
    }

    /*
      ======================================
      JSONP VERBINDING
      ======================================

      GitHub Pages en Apps Script staan
      op verschillende domeinen.

      Daarom gebruiken we JSONP, passend
      bij de bestaande scanapi in Code.gs.
    */

    function vraagServer(id, token, pin) {
      return new Promise(function(resolve, reject) {

        const callbackNaam =
          "__feestScanner_" +
          Date.now() +
          "_" +
          Math.floor(Math.random() * 1000000);

        const script =
          document.createElement("script");

        let klaar = false;

        const timer = setTimeout(function() {
          afronden(
            new Error(
              "De ticketserver reageert niet binnen 20 seconden."
            )
          );
        }, REQUEST_TIMEOUT);

        function opruimen() {
          clearTimeout(timer);

          try {
            delete window[callbackNaam];
          } catch (err) {
            window[callbackNaam] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        function afronden(fout, data) {
          if (klaar) return;

          klaar = true;
          opruimen();

          if (fout) {
            reject(fout);
          } else {
            resolve(data);
          }
        }

        window[callbackNaam] = function(data) {
          afronden(null, data);
        };

        script.onerror = function() {
          afronden(
            new Error(
              "Kan geen verbinding maken met de ticketserver."
            )
          );
        };

        const params = new URLSearchParams();

        params.set("page", "scanapi");
        params.set("id", id);
        params.set("token", token);
        params.set("pin", pin);
        params.set("callback", callbackNaam);
        params.set("_", String(Date.now()));

        script.src =
          SERVER + "?" + params.toString();

        document.head.appendChild(script);
      });
    }

    /*
      ======================================
      RESULTAAT VERWERKEN
      ======================================
    */

    function toonServerResultaat(data) {
      if (!data || typeof data !== "object") {
        toon(
          "❌ Ongeldig antwoord van ticketserver.",
          "fout"
        );
        return;
      }

      if (data.geldig === true) {
        toon(
          "✅ GELDIG TICKET\n" +
          (data.naam || "") +
          "\nToegang toegestaan",
          "goed"
        );
        return;
      }

      if (data.fout === "gebruikt") {
        toon(
          "❌ TICKET AL GEBRUIKT\n" +
          (data.naam || ""),
          "fout"
        );
        return;
      }

      if (data.fout === "niet_betaald") {
        toon(
          "❌ TICKET NIET BETAALD\n" +
          (data.naam || ""),
          "fout"
        );
        return;
      }

      if (data.fout === "pin") {
        toon(
          "❌ ONJUISTE SCANNER-PIN",
          "fout"
        );
        return;
      }

      if (data.fout === "ongeldig") {
        toon(
          "❌ ONGELDIG TICKET",
          "fout"
        );
        return;
      }

      toon(
        "❌ " +
        (data.bericht || "Ticket kon niet worden gecontroleerd."),
        "fout"
      );
    }

    /*
      ======================================
      TICKET CONTROLEREN
      ======================================
    */

    async function verwerkTicket(invoer) {
      if (bezig) return;

      const pin = pinInput.value.trim();

      if (!pin) {
        toon(
          "Vul eerst de scanner-PIN in.",
          "waarschuwing"
        );
        return;
      }

      let ticket;

      try {
        ticket = leesTicket(invoer);

      } catch (err) {
        toon(err.message, "fout");

        /*
          Geen volledige QR-link tonen.
          Daarin staat een geheime token.
        */

        debug(
          "De camera heeft tekst gelezen, " +
          "maar geen geldige ticketgegevens gevonden."
        );

        return;
      }

      /*
        Voorkom snelle dubbele scans.
      */

      const sleutel =
        ticket.id + "|" + ticket.token;

      const nu = Date.now();

      if (
        sleutel === laatsteInvoer &&
        nu - laatsteTijd < 4000
      ) {
        return;
      }

      laatsteInvoer = sleutel;
      laatsteTijd = nu;

      zetBezig(true);

      toon(
        "Ticket controleren...",
        "info"
      );

      debug(
        "Gelezen ticketnummer: " + ticket.id
      );

      try {
        const antwoord = await vraagServer(
          ticket.id,
          ticket.token,
          pin
        );

        toonServerResultaat(antwoord);

      } catch (err) {
        toon(
          "❌ VERBINDINGSFOUT\n" +
          err.message,
          "fout"
        );

      } finally {
        zetBezig(false);
      }
    }

    /*
      ======================================
      CAMERA
      ======================================
    */

    function cameraSucces(decodedText) {
      verwerkTicket(decodedText);
    }

    function cameraFout(errorMessage) {
      /*
        Niet elk camerabeeld bevat een QR-code.
        Daarom tonen we deze normale
        leesmeldingen niet als fout.
      */
    }

    function startCamera() {
      if (
        typeof Html5QrcodeScanner === "undefined"
      ) {
        toon(
          "QR-scannerbibliotheek kon niet worden geladen.",
          "fout"
        );
        return;
      }

      scanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          },
          rememberLastUsedCamera: true,
          showTorchButtonIfSupported: true
        },
        false
      );

      scanner.render(
        cameraSucces,
        cameraFout
      );
    }

    async function herstartCamera() {
      toon(
        "Camera opnieuw starten...",
        "info"
      );

      if (scanner) {
        try {
          await scanner.clear();
        } catch (err) {
          console.log(err);
        }
      }

      document.getElementById("reader")
        .innerHTML = "";

      scanner = null;

      laatsteInvoer = "";
      laatsteTijd = 0;

      startCamera();
    }

    /*
      ======================================
      KNOPPEN
      ======================================
    */

    handmatigKnop.addEventListener(
      "click",
      function() {
        verwerkTicket(
          handmatigInput.value.trim()
        );
      }
    );

    handmatigInput.addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          event.preventDefault();

          verwerkTicket(
            handmatigInput.value.trim()
          );
        }
      }
    );

    herstartKnop.addEventListener(
      "click",
      herstartCamera
    );

    /*
      ======================================
      START
      ======================================
    */

    window.addEventListener(
      "load",
      startCamera
    );
  </script>

</body>
</html>
