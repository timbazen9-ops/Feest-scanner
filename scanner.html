<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ticket Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 550px;
      margin: auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    #reader {
      width: 100%;
      margin-top: 25px;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    #resultaat {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
      min-height: 40px;
    }

    button {
      margin-top: 20px;
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎟️ Ticket Scanner</h1>

  <p>
    Richt de camera op de QR-code van het ticket.
  </p>

  <div id="reader"></div>

  <div id="resultaat">
    Scanner starten...
  </div>

  <button onclick="startScanner()">
    Scanner opnieuw starten
  </button>

</div>

<script>

const WEBAPP_URL =
  "https://script.google.com/macros/s/AKfycbxJZJgxn0BpdSv8b2K9MAuNaPvgsBlCO5tdnlivnWTFdNqnB8w6frFH0dofm4Oyx9YF/exec";

let scanner = null;
let bezig = false;


function qrGevonden(qrTekst) {

  if (bezig) {
    return;
  }

  bezig = true;

  document.getElementById("resultaat").innerText =
    "QR-code gevonden...";

  try {

    const url = new URL(qrTekst);

    const id =
      url.searchParams.get("id");

    const token =
      url.searchParams.get("token");

    if (!id || !token) {

      document.getElementById("resultaat").innerText =
        "❌ Ongeldige QR-code.";

      bezig = false;

      return;
    }

    const controleURL =
      WEBAPP_URL +
      "?page=controle" +
      "&id=" +
      encodeURIComponent(id) +
      "&token=" +
      encodeURIComponent(token);

    window.location.href =
      controleURL;

  } catch (error) {

    document.getElementById("resultaat").innerText =
      "❌ Ongeldige QR-code.";

    bezig = false;
  }
}


function startScanner() {

  bezig = false;

  document.getElementById("resultaat").innerText =
    "Camera wordt gestart...";

  if (scanner) {

    scanner.clear().catch(function() {});

  }

  scanner =
    new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera: true,

        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA
        ]
      },
      false
    );

  scanner.render(
    qrGevonden,
    function() {
      // Normale scanpogingen geven vaak tijdelijk
      // geen QR-code. Daarom tonen we hier geen fout.
    }
  );

  document.getElementById("resultaat").innerText =
    "Kies de camera en start met scannen.";
}


startScanner();

</script>

</body>
</html>
