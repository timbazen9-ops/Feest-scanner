<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Feest-scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      padding: 18px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 560px;
      margin: auto;
    }

    h1 {
      margin: 8px 0 12px;
    }

    #reader {
      width: 100%;
      background: white;
      border-radius: 16px;
      overflow: hidden;
    }

    #status {
      margin: 18px 0;
      padding: 22px 14px;
      border-radius: 16px;
      background: #222;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #statusTitel {
      font-size: 30px;
      font-weight: bold;
    }

    #statusNaam {
      margin-top: 8px;
      font-size: 23px;
    }

    .goed {
      background: #0b7a2a !important;
    }

    .fout {
      background: #b3261e !important;
    }

    .waarschuwing {
      background: #9a6700 !important;
    }

    button, input {
      box-sizing: border-box;
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      font-size: 18px;
    }

    input {
      border: 1px solid #aaa;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    #pinBox {
      background: #222;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 18px;
    }

    #scannerBox {
      display: none;
    }

    .klein {
      font-size: 14px;
      opacity: .8;
      margin-top: 8px;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>🎟️ Feest-scanner</h1>

  <div id="pinBox">
    <p>Voer één keer de organisator-PIN in.</p>

    <input
      id="pin"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      placeholder="PIN">

    <button onclick="scannerStarten()">
      Scanner starten
    </button>
  </div>

  <div id="scannerBox">
    <div id="reader"></div>

    <div id="status">
      <div id="statusTitel">Klaar om te scannen</div>
      <div id="statusNaam"></div>
    </div>

    <div class="klein">
      Na iedere scan gaat de camera automatisch verder.
    </div>
  </div>
</div>

<script>
const WEBAPP_URL =
  "https://script.google.com/macros/s/AKfycbxJZJgxn0BpdSv8b2K9MAuNaPvgsBlCO5tdnlivnWTFdNqnB8w6frFH0dofm4Oyx9YF/exec";

let scanner = null;
let bezig = false;
let scannerPin = "";
let laatsteQr = "";
let laatsteScanTijd = 0;

function toonStatus(titel, naam, soort) {
  const box = document.getElementById("status");
  const titelEl = document.getElementById("statusTitel");
  const naamEl = document.getElementById("statusNaam");

  box.className = "";

  if (soort) {
    box.classList.add(soort);
  }

  titelEl.textContent = titel || "";
  naamEl.textContent = naam || "";
}

function haalTicketUitQr(qrTekst) {
  try {
    const url = new URL(qrTekst);

    const id = url.searchParams.get("id");
    const token = url.searchParams.get("token");

    if (!id || !token) {
      return null;
    }

    return {
      id: id,
      token: token
    };

  } catch (error) {
    return null;
  }
}

function roepScannerApiAan(ticket, qrTekst) {
  return new Promise(function(resolve, reject) {

    const callbackNaam =
      "__ticketCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const script =
      document.createElement("script");

    let klaar = false;

    const timeout = setTimeout(function() {
      opruimen();
      reject(
        new Error("Geen antwoord van de ticketserver.")
      );
    }, 10000);

    function opruimen() {
      if (klaar) return;

      klaar = true;
      clearTimeout(timeout);

      try {
        delete window[callbackNaam];
      } catch (error) {
        window[callbackNaam] = undefined;
      }

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    window[callbackNaam] = function(data) {
      opruimen();
      resolve(data);
    };

    script.onerror = function() {
      opruimen();

      reject(
        new Error(
          "Ticketserver kon niet worden bereikt."
        )
      );
    };

    script.src =
      WEBAPP_URL +
      "?page=scanapi" +
      "&id=" +
      encodeURIComponent(ticket.id) +
      "&token=" +
      encodeURIComponent(ticket.token) +
      "&qr=" +
      encodeURIComponent(qrTekst) +
      "&pin=" +
      encodeURIComponent(scannerPin) +
      "&callback=" +
      encodeURIComponent(callbackNaam) +
      "&t=" +
      Date.now();

    document.body.appendChild(script);
  });
}

async function qrGevonden(qrTekst) {

  const nu = Date.now();

  if (bezig) {
    return;
  }

  if (
    qrTekst === laatsteQr &&
    nu - laatsteScanTijd < 4000
  ) {
    return;
  }

  laatsteQr = qrTekst;
  laatsteScanTijd = nu;
  bezig = true;

  const ticket =
    haalTicketUitQr(qrTekst);

  if (!ticket) {

    toonStatus(
      "ONGELDIGE QR-CODE",
      "",
      "fout"
    );

    setTimeout(function() {

      bezig = false;

      toonStatus(
        "Klaar voor volgende ticket",
        "",
        ""
      );

    }, 1800);

    return;
  }

  toonStatus(
    "Ticket controleren...",
    "",
    ""
  );

  try {

    const resultaat =
      await roepScannerApiAan(
        ticket,
        qrTekst
      );

    if (resultaat.geldig) {

      toonStatus(
        "✓ TICKET GELDIG",
        resultaat.naam || "",
        "goed"
      );

    } else if (
      resultaat.fout === "pin"
    ) {

      toonStatus(
        "ONJUISTE PIN",
        "Ververs de pagina en voer de juiste PIN in.",
        "fout"
      );

      return;

    } else if (
      resultaat.gebruikt
    ) {

      toonStatus(
        "✕ TICKET AL GEBRUIKT",
        resultaat.naam || "",
        "fout"
      );

    } else {

      toonStatus(
        resultaat.bericht ||
          "ONGELDIG TICKET",
        resultaat.naam || "",
        "waarschuwing"
      );
    }

  } catch (error) {

    toonStatus(
      "VERBINDINGSFOUT",
      error.message ||
        "Probeer opnieuw.",
      "fout"
    );
  }

  setTimeout(function() {

    bezig = false;

    toonStatus(
      "Klaar voor volgende ticket",
      "",
      ""
    );

  }, 2200);
}

function scannerStarten() {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();

  if (!pin) {

    alert(
      "Vul eerst de organisator-PIN in."
    );

    return;
  }

  scannerPin = pin;

  document
    .getElementById("pinBox")
    .style.display = "none";

  document
    .getElementById("scannerBox")
    .style.display = "block";

  scanner =
    new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        rememberLastUsedCamera: true,

        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA
        ]
      },
      false
    );

  scanner.render(
    qrGevonden,
    function() {
      // Geen melding nodig tijdens
      // normale scanpogingen.
    }
  );

  toonStatus(
    "Kies/start de camera",
    "",
    ""
  );
}
</script>

</body>
</html>
